name: searxng
services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng-net
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - searxng-net
    depends_on:
      - valkey
    ports:
      - "8080:8080"
    volumes:
      - /etc/searxng:/etc/searxng:rw
    environment:
      # - SEARXNG_BASE_URL=http://127.0.0.1:8080/  # Try this line first if you're not sure what IP address to use.
      - SEARXNG_BASE_URL=http://YOUR.IP.ADDRESS.HERE:8080/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"


networks:
  searxng-net:

volumes:
  valkey-data:
