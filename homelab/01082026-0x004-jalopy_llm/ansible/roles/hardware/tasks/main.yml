---
# Phase 2 — Verify hardware
#
# Everything here is read-only. It asserts the box matches what LOCAL_AI_PLAN.md
# assumes, and records the numbers you are supposed to re-check monthly.

- name: Ensure the baseline directory exists
  ansible.builtin.file:
    path: "{{ aihost_state_dir }}/baselines"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether today's baseline already exists
  ansible.builtin.stat:
    path: "{{ aihost_state_dir }}/baselines/hardware-{{ aihost_today }}.md"
  register: hardware_baseline_stat

- name: Decide whether to record a baseline
  # One baseline per day. Without this the role rewrites a timestamped report on
  # every converge, so it can never report changed=0 and you lose "changed" as a
  # signal that something actually drifted. The monthly-trend workflow only
  # needs one snapshot per run-day; force a fresh one with
  #   -e hardware_force_baseline=true
  ansible.builtin.set_fact:
    hardware_record: "{{ hardware_force_baseline | bool or not hardware_baseline_stat.stat.exists }}"

# --- CPU / NUMA ---------------------------------------------------------------

- name: Read the NUMA topology
  ansible.builtin.command: numactl --hardware
  changed_when: false
  register: hardware_numactl

- name: Count NUMA nodes
  ansible.builtin.set_fact:
    hardware_numa_nodes: >-
      {{ hardware_numactl.stdout_lines
         | select('match', '^node [0-9]+ size:')
         | list | length }}

- name: Assert both sockets are present and populated
  ansible.builtin.assert:
    that:
      - hardware_numa_nodes | int == aihost_expect_numa_nodes | int
    fail_msg: >-
      Expected {{ aihost_expect_numa_nodes }} NUMA nodes, found
      {{ hardware_numa_nodes }}. A missing node means a CPU is not seated or
      not detected — stop and fix that before tuning anything.
    success_msg: "{{ hardware_numa_nodes }} NUMA nodes"
  register: hardware_numa_assert
  failed_when:
    - hardware_numa_assert is failed
    - aihost_hardware_asserts_fatal | bool

# --- Memory -------------------------------------------------------------------

- name: Read the DMI memory table
  ansible.builtin.command: dmidecode -t memory
  changed_when: false
  register: hardware_dmidecode

- name: Extract DIMM population and configured speed
  ansible.builtin.set_fact:
    hardware_dimms_populated: >-
      {{ hardware_dmidecode.stdout_lines
         | map('trim')
         | select('match', '^Size: [0-9]+ [MG]B$')
         | list | length }}
    hardware_mem_speeds: >-
      {{ hardware_dmidecode.stdout_lines
         | map('trim')
         | select('match', '^Configured Memory Speed: [0-9]+ MT/s$')
         | map('regex_replace', '\D', '')
         | map('int') | unique | sort }}

- name: Assert the memory configuration has not drifted
  ansible.builtin.assert:
    that:
      - hardware_dimms_populated | int == aihost_expect_dimms | int
      - hardware_mem_speeds | length == 1
      - hardware_mem_speeds[0] | int == aihost_expect_mem_speed_mts | int
      - ansible_facts.memtotal_mb | int >= (aihost_expect_total_mem_gb | int * 1024 * 0.9) | int
    fail_msg: >-
      Memory mismatch. Found {{ hardware_dimms_populated }} DIMMs at
      {{ hardware_mem_speeds }} MT/s, {{ ansible_facts.memtotal_mb }} MB total;
      expected {{ aihost_expect_dimms }} DIMMs at {{ aihost_expect_mem_speed_mts }} MT/s.
      Do NOT "fix" this by adding sticks — 12 is unbalanced and 16 has known
      faults on this board. Re-read the troubleshooting log in LOCAL_AI_PLAN.md.
    success_msg: >-
      {{ hardware_dimms_populated }} DIMMs @ {{ hardware_mem_speeds[0] }} MT/s,
      {{ ansible_facts.memtotal_mb }} MB total
  register: hardware_mem_assert
  failed_when:
    - hardware_mem_assert is failed
    - aihost_hardware_asserts_fatal | bool

- name: Measure achieved memory bandwidth
  ansible.builtin.command: "mbw -q -n {{ hardware_mbw_runs }} {{ hardware_mbw_size_mb }}"
  changed_when: false
  when: hardware_run_mbw | bool and hardware_record | bool
  register: hardware_mbw

- name: Summarise the bandwidth result
  ansible.builtin.set_fact:
    hardware_mbw_avg: >-
      {{ hardware_mbw.stdout_lines
         | select('search', '^AVG')
         | map('regex_replace', '^.*Copy:\s*([0-9.]+)\s*MiB/s.*$', '\1')
         | map('trim') | list }}
  # mbw is skipped when today's baseline already exists, so guard on its output
  # rather than on the run flag.
  when: hardware_mbw.stdout_lines is defined

# --- Disks --------------------------------------------------------------------

- name: Inventory the block devices
  ansible.builtin.command: lsblk -o NAME,SIZE,MODEL,SERIAL,MOUNTPOINT
  changed_when: false
  register: hardware_lsblk

- name: Resolve the 8 TB by-id path to a kernel device
  ansible.builtin.command: "readlink -f {{ aihost_tank_disk_by_id | quote }}"
  changed_when: false
  when: aihost_tank_disk_by_id | length > 0
  register: hardware_tank_dev

- name: Read SMART data from the 8 TB
  # -j gives structured output; the runbook's grep for attribute ids is a shell
  # accident waiting to happen when smartctl changes its column padding.
  ansible.builtin.command: "smartctl -j -a {{ hardware_tank_dev.stdout | trim }}"
  changed_when: false
  # smartctl's exit status is a bitmask. Bits 0-2 (<8) mean the tool could not
  # talk to the drive at all — that is fatal here. Bits 3-7 report the drive's
  # condition (failing, logged errors), which on this disk is the known state we
  # are recording rather than a reason to abort.
  failed_when: (hardware_smart.rc | int) in [1, 2, 3, 4, 5, 6, 7]
  when: aihost_tank_disk_by_id | length > 0
  register: hardware_smart

- name: Extract the SMART attributes worth trending
  ansible.builtin.set_fact:
    hardware_smart_tracked: >-
      {{ dict(smart_rows | map(attribute='name')
              | zip(smart_rows | map(attribute='raw.value'))) }}
  vars:
    smart_rows: >-
      {{ (hardware_smart.stdout | from_json).ata_smart_attributes.table
         | default([])
         | selectattr('id', 'in', hardware_smart_attributes)
         | list }}
  when:
    - hardware_smart.stdout is defined
    - "'ata_smart_attributes' in hardware_smart.stdout"

- name: Report the SMART attributes
  ansible.builtin.debug:
    var: hardware_smart_tracked
  when: hardware_smart_tracked is defined

- name: Start the long SMART self-test (~12h)
  ansible.builtin.command: "smartctl -t long {{ hardware_tank_dev.stdout | trim }}"
  changed_when: true
  when:
    - hardware_smart_long_test | bool
    - not (hardware_smart_report_only | bool)
    - aihost_tank_disk_by_id | length > 0

# --- Record -------------------------------------------------------------------

- name: Record the hardware baseline
  ansible.builtin.template:
    src: baseline.md.j2
    dest: "{{ aihost_state_dir }}/baselines/hardware-{{ aihost_today }}.md"
    owner: root
    group: root
    mode: "0644"
  when: hardware_record | bool

- name: Keep a stable "latest" pointer
  ansible.builtin.file:
    src: "hardware-{{ aihost_today }}.md"
    dest: "{{ aihost_state_dir }}/baselines/hardware-latest.md"
    state: link
    owner: root
    group: root

- name: Preserve the raw SMART JSON alongside it
  ansible.builtin.copy:
    content: "{{ hardware_smart.stdout }}"
    dest: "{{ aihost_state_dir }}/baselines/smart-tank-{{ aihost_today }}.json"
    owner: root
    group: root
    mode: "0644"
  when:
    - hardware_smart.stdout is defined
    - hardware_record | bool

- name: Fetch baselines to the control node
  ansible.builtin.fetch:
    src: "{{ aihost_state_dir }}/baselines/hardware-{{ aihost_today }}.md"
    dest: "artifacts/{{ inventory_hostname }}/hardware-{{ aihost_today }}.md"
    flat: true
  when:
    - hardware_fetch_baselines | bool
    - hardware_record | bool

- name: Phase 2 checkpoint
  ansible.builtin.debug:
    msg:
      - "NUMA nodes: {{ hardware_numa_nodes }}"
      - "Memory: {{ hardware_dimms_populated }} DIMMs @ {{ hardware_mem_speeds | join(',') }} MT/s"
      - "Bandwidth (MiB/s): {{ hardware_mbw_avg | default(['not measured']) | join(', ') }}"
      - "Baseline written to {{ aihost_state_dir }}/baselines/hardware-{{ aihost_today }}.md"
      - "Trend matters more than the absolute SMART numbers — re-run monthly."
