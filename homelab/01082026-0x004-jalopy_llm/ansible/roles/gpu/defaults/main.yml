---
# On 26.04 CUDA is native to the archive; on 24.04 this pulls the older archive
# toolkit, which is still fine for sm_75. Set to "" to manage CUDA yourself
# (e.g. NVIDIA's own repo).
gpu_cuda_package: nvidia-cuda-toolkit

# Where the discovered GPU topology is persisted so later phases (and later
# runs) can read it back as ansible_local.aihost.*
gpu_facts_dir: /etc/ansible/facts.d
